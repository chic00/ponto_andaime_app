<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* =========================================================================
   CONFIGURAÇÃO — as credenciais do Supabase NÃO ficam mais escritas aqui.
   Elas são buscadas em tempo de execução no endpoint /api/config (uma
   função serverless da Vercel — veja o arquivo api/config.js), que por sua
   vez lê as variáveis de ambiente SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY
   configuradas no painel da Vercel (Project Settings > Environment
   Variables). Assim, trocar de arquivo HTML no futuro nunca mais exige
   colar chave nenhuma de novo.
   ========================================================================= */
const PHOTOS_BUCKET = 'andaime-fotos';
let sb = null;
let isConfigured = false;

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

/* =========================================================================
   CAMADA DE SERVIÇOS — agora falando com Postgres + Auth + Storage reais.
   A troca de localStorage para Supabase ficou isolada aqui dentro; as
   telas continuam chamando authService/rentalService/photoService/
   settingsService exatamente como antes.
   ========================================================================= */

const authService = {
  async login(email, password){
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error) return { ok:false, error: error.message === 'Invalid login credentials' ? 'E-mail ou senha inválidos.' : error.message };
    return { ok:true, session: data.session };
  },
  async logout(){ await sb.auth.signOut(); },
  async getSession(){
    const { data } = await sb.auth.getSession();
    return data.session;
  },
  onChange(cb){
    const { data } = sb.auth.onAuthStateChange((_event, session) => cb(session));
    return () => data.subscription.unsubscribe();
  }
};

function rowToRental(row){
  return {
    id: row.id, customerId: row.customer_id || null, customerName: row.customer_name, document: row.document || '', phone: row.phone || '',
    whatsapp: row.whatsapp || '', email: row.email || '', customerNotes: row.customer_notes || '',
    rentalDate: row.rental_date || '', expectedReturnDate: row.expected_return_date || '',
    items: (row.rental_items || []).map(i => ({ id:i.id, equipmentType:i.equipment_type, quantity:i.quantity || '' })),
    description: row.description || '',
    rentalNotes: row.rental_notes || '', address: row.address || '', number: row.number || '',
    complement: row.complement || '', neighborhood: row.neighborhood || '', city: row.city || '',
    state: row.state || '', zipCode: row.zip_code || '', locationUrl: row.location_url || '',
    manualStatus: row.manual_status, closedAt: row.closed_at || '', deletedAt: row.deleted_at || null, createdAt: row.created_at, updatedAt: row.updated_at,
    photos: (row.photos || []).map(p => ({ id:p.id, storagePath:p.storage_path, description:p.description || '', createdAt:p.created_at }))
  };
}
function rentalToRow(form){
  return {
    customer_name: form.customerName, document: form.document, phone: form.phone, whatsapp: form.whatsapp,
    email: form.email, customer_notes: form.customerNotes, rental_date: form.rentalDate || null,
    expected_return_date: form.expectedReturnDate || null,
    description: form.description, rental_notes: form.rentalNotes, address: form.address, number: form.number,
    complement: form.complement, neighborhood: form.neighborhood, city: form.city, state: form.state,
    zip_code: form.zipCode, location_url: form.locationUrl
  };
}
function computeStatus(r){
  if(r.manualStatus === 'encerrada') return 'encerrada';
  if(!r.expectedReturnDate) return 'ativa';
  const today = new Date(); today.setHours(0,0,0,0);
  const ret = new Date(r.expectedReturnDate + 'T00:00:00');
  const diffDays = Math.round((ret - today) / 86400000);
  if(diffDays < 0) return 'vencida';
  if(diffDays <= 5) return 'proxima';
  return 'ativa';
}

const equipmentTypeService = {
  async list(){
    const { data, error } = await sb.from('equipment_types').select('*').order('name');
    if(error) throw error;
    return data.map(t => ({ id:t.id, name:t.name }));
  },
  async create(name){
    const clean = name.trim();
    if(!clean) throw new Error('Informe um nome para o tipo de andaime.');
    const { data: userData } = await sb.auth.getUser();
    const { data, error } = await sb.from('equipment_types').insert({ owner:userData.user.id, name:clean }).select().single();
    if(error){
      if(error.code === '23505') throw new Error('Esse tipo já está cadastrado.');
      throw error;
    }
    return { id:data.id, name:data.name };
  },
  /* Junta 2+ tipos num só nome final. Atualiza todos os itens de locação
     que usavam os nomes antigos, e limpa o catálogo dos tipos que sobraram
     redundantes. Não apaga nenhuma locação nem item, só o texto do tipo. */
  async merge(selected, finalName){
    const finalTrim = finalName.trim();
    if(!finalTrim) throw new Error('Informe o nome final do tipo.');
    const oldNames = selected.map(s => s.name).filter(n => n !== finalTrim);
    if(oldNames.length){
      const { error: updErr } = await sb.from('rental_items').update({ equipment_type: finalTrim }).in('equipment_type', oldNames);
      if(updErr) throw updErr;
    }
    const { data: existing } = await sb.from('equipment_types').select('id').eq('name', finalTrim).maybeSingle();
    if(!existing){
      const { data: userData } = await sb.auth.getUser();
      const { error: insErr } = await sb.from('equipment_types').insert({ owner:userData.user.id, name:finalTrim });
      if(insErr) throw insErr;
    }
    const idsToDelete = selected.filter(s => s.name !== finalTrim).map(s => s.id);
    if(idsToDelete.length){
      const { error: delErr } = await sb.from('equipment_types').delete().in('id', idsToDelete);
      if(delErr) throw delErr;
    }
  },
  async remove(id){
    const { error } = await sb.from('equipment_types').delete().eq('id', id);
    if(error) throw error;
  }
};

async function replaceRentalItems(rentalId, items){
  const { error: delErr } = await sb.from('rental_items').delete().eq('rental_id', rentalId);
  if(delErr) throw delErr;
  const rows = (items || []).filter(i => i.equipmentType && i.equipmentType.trim())
    .map(i => ({ rental_id: rentalId, equipment_type: i.equipmentType.trim(), quantity: i.quantity || '' }));
  if(rows.length){
    const { error } = await sb.from('rental_items').insert(rows);
    if(error) throw error;
  }
}

const rentalService = {
  async list(){
    const { data, error } = await sb.from('rentals').select('*, photos(*), rental_items(*)').is('deleted_at', null).order('created_at', { ascending:false });
    if(error) throw error;
    return data.map(rowToRental).map(r => ({...r, status: computeStatus(r)}));
  },
  async get(id){
    const { data, error } = await sb.from('rentals').select('*, photos(*), rental_items(*)').eq('id', id).maybeSingle();
    if(error) throw error;
    if(!data) return null;
    const r = rowToRental(data);
    return {...r, status: computeStatus(r)};
  },
  async create(form){
    const { data: userData } = await sb.auth.getUser();
    const customerId = await customerService.upsertFromRentalForm(form, userData.user.id);
    const row = { ...rentalToRow(form), owner: userData.user.id, customer_id: customerId };
    const { data, error } = await sb.from('rentals').insert(row).select('*, photos(*), rental_items(*)').single();
    if(error) throw error;
    await replaceRentalItems(data.id, form.items);
    const { data: fresh } = await sb.from('rentals').select('*, photos(*), rental_items(*)').eq('id', data.id).single();
    return rowToRental(fresh);
  },
  async update(id, form){
    const { data: userData } = await sb.auth.getUser();
    const customerId = await customerService.upsertFromRentalForm(form, userData.user.id);
    const row = { ...rentalToRow(form), customer_id: customerId, updated_at: new Date().toISOString() };
    const { data, error } = await sb.from('rentals').update(row).eq('id', id).select('*, photos(*), rental_items(*)').single();
    if(error) throw error;
    await replaceRentalItems(id, form.items);
    const { data: fresh } = await sb.from('rentals').select('*, photos(*), rental_items(*)').eq('id', id).single();
    return rowToRental(fresh);
  },
  /* Exclusão SUAVE: só marca deleted_at, não apaga nada de verdade — nem
     a locação, nem as fotos no Storage. Vai pra lixeira, recuperável.
     Como o Supabase free não tem backup nenhum, isso é a única rede de
     segurança real contra exclusão feita sem querer. */
  async remove(id){
    const { error } = await sb.from('rentals').update({ deleted_at: new Date().toISOString() }).eq('id', id);
    if(error) throw error;
  },
  async restore(id){
    const { error } = await sb.from('rentals').update({ deleted_at: null }).eq('id', id);
    if(error) throw error;
  },
  async listTrash(){
    const { data, error } = await sb.from('rentals').select('*, photos(*), rental_items(*)').not('deleted_at', 'is', null).order('deleted_at', { ascending:false });
    if(error) throw error;
    return data.map(rowToRental).map(r => ({...r, status: computeStatus(r)}));
  },
  /* Exclusão DEFINITIVA — aqui sim apaga a locação e as fotos no Storage
     de vez. Só é chamada a partir da tela de Lixeira, nunca direto da
     listagem principal. */
  async purge(id){
    const { data: photos } = await sb.from('photos').select('storage_path').eq('rental_id', id);
    if(photos && photos.length){
      await sb.storage.from(PHOTOS_BUCKET).remove(photos.map(p => p.storage_path));
    }
    const { error } = await sb.from('rentals').delete().eq('id', id);
    if(error) throw error;
  },
  async setManualStatus(id, status, closedDate){
    const { error } = await sb.from('rentals').update({
      manual_status: status,
      closed_at: status === 'encerrada' ? (closedDate || new Date().toISOString().slice(0,10)) : null,
      updated_at: new Date().toISOString()
    }).eq('id', id);
    if(error) throw error;
  }
};

/* ---- customerService -------------------------------------------------------
   Cadastro de cliente "mestre", reaproveitável entre locações. Cada locação
   continua guardando sua PRÓPRIA cópia dos dados do cliente (nome/telefone/
   etc. no momento daquela locação) — isso é proposital: se o telefone do
   cliente mudar depois, o histórico da locação antiga continua mostrando o
   que era válido na época. O registro em "customers" serve só para reuso
   (autocompletar) e para a tela de Clientes, sem apagar histórico de ninguém.
   ========================================================================= */
const customerService = {
  async list(){
    const { data, error } = await sb.from('customers').select('*').order('name');
    if(error) throw error;
    return data.map(c => ({ id:c.id, name:c.name, document:c.document||'', phone:c.phone||'', whatsapp:c.whatsapp||'', email:c.email||'', notes:c.notes||'', createdAt:c.created_at }));
  },
  async create(data, ownerId){
    const { data: userData } = ownerId ? { data:{ user:{id:ownerId} } } : await sb.auth.getUser();
    const row = { owner: userData.user.id, name:data.name, document:data.document, phone:data.phone, whatsapp:data.whatsapp, email:data.email, notes:data.notes };
    const { data: inserted, error } = await sb.from('customers').insert(row).select().single();
    if(error) throw error;
    return inserted;
  },
  async update(id, data){
    const { error } = await sb.from('customers').update({
      name:data.name, document:data.document, phone:data.phone, whatsapp:data.whatsapp, email:data.email, notes:data.notes, updated_at:new Date().toISOString()
    }).eq('id', id);
    if(error) throw error;
  },
  async remove(id){
    const { error } = await sb.from('customers').delete().eq('id', id);
    if(error) throw error;
  },
  async search(query){
    if(!query || !query.trim()) return [];
    const q = `%${query.trim()}%`;
    const { data, error } = await sb.from('customers').select('*').or(`name.ilike.${q},phone.ilike.${q},whatsapp.ilike.${q},document.ilike.${q}`).limit(8);
    if(error) throw error;
    return data;
  },
  /* Cria ou atualiza silenciosamente o cliente-mestre a partir dos dados
     digitados numa locação — usa o documento (ou nome+telefone, se não
     houver documento) como chave para saber se é o mesmo cliente de novo. */
  async upsertFromRentalForm(form, ownerId){
    if(!form.customerName || !form.customerName.trim()) return null;
    let existing = null;
    if(form.document && form.document.trim()){
      const { data } = await sb.from('customers').select('id').eq('document', form.document.trim()).maybeSingle();
      existing = data;
    }
    if(!existing && form.phone && form.phone.trim()){
      const { data } = await sb.from('customers').select('id').eq('phone', form.phone.trim()).ilike('name', form.customerName.trim()).maybeSingle();
      existing = data;
    }
    const payload = { name:form.customerName, document:form.document, phone:form.phone, whatsapp:form.whatsapp, email:form.email, notes:form.customerNotes };
    if(existing){
      await this.update(existing.id, payload);
      return existing.id;
    }
    const created = await this.create(payload, ownerId);
    return created.id;
  }
};


/* ---- photoService ---------------------------------------------------------
   Fotos agora são arquivos reais no Supabase Storage (bucket privado), não
   mais base64 dentro do banco. As URLs de exibição são "assinadas" (válidas
   por 1h) porque o bucket não é público — assim as fotos de obra do cliente
   não ficam acessíveis por link direto pra qualquer pessoa na internet. */
const photoService = {
  async uploadForRental(rentalId, files){
    const results = [];
    for(const file of files){
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const path = `${rentalId}/${uid('img')}.${ext}`;
      const { error: upErr } = await sb.storage.from(PHOTOS_BUCKET).upload(path, file, { contentType:file.type });
      if(upErr) throw upErr;
      const { data, error } = await sb.from('photos').insert({ rental_id: rentalId, storage_path: path, description:'' }).select().single();
      if(error) throw error;
      results.push({ id:data.id, storagePath:data.storage_path, description:'', createdAt:data.created_at });
    }
    return results;
  },
  async remove(photoId, storagePath){
    await sb.storage.from(PHOTOS_BUCKET).remove([storagePath]);
    const { error } = await sb.from('photos').delete().eq('id', photoId);
    if(error) throw error;
  },
  async updateDescription(photoId, description){
    const { error } = await sb.from('photos').update({ description }).eq('id', photoId);
    if(error) throw error;
  },
  async signedUrl(storagePath){
    const { data, error } = await sb.storage.from(PHOTOS_BUCKET).createSignedUrl(storagePath, 3600);
    if(error) throw error;
    return data.signedUrl;
  },
  /* Apaga as fotos (arquivo + registro) de locações cuja devolução prevista
     (ou, se não houver, a data da locação) já passou há mais de `days` dias.
     A locação em si NÃO é apagada — só as fotos, que são o que mais pesa no
     armazenamento e, segundo o combinado, não precisam ficar guardadas
     depois que o andaime já foi retirado da obra. */
  async findOldPhotoCandidates(days){
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - days);
    const cutoffStr = cutoff.toISOString().slice(0,10);
    const { data, error } = await sb.from('rentals')
      .select('id, customer_name, rental_date, expected_return_date, closed_at, photos(id, storage_path)')
      .is('deleted_at', null);
    if(error) throw error;
    return data.filter(r => r.photos && r.photos.length > 0)
      .map(r => ({
        rentalId:r.id, customerName:r.customer_name,
        referenceDate: r.closed_at || r.expected_return_date || r.rental_date,
        photoCount:r.photos.length, photos:r.photos
      }))
      .filter(c => c.referenceDate && c.referenceDate < cutoffStr);
  },
  async cleanupOldPhotos(candidates){
    let removed = 0;
    for(const c of candidates){
      const paths = c.photos.map(p => p.storage_path);
      if(paths.length) await sb.storage.from(PHOTOS_BUCKET).remove(paths);
      const ids = c.photos.map(p => p.id);
      await sb.from('photos').delete().in('id', ids);
      removed += ids.length;
    }
    return removed;
  }
};

/* Comprimir/redimensionar a foto no navegador antes do upload — de graça,
   sem depender de nenhum plano pago do Supabase. Reduz uma foto de celular
   de ~1.3MB pra tipicamente 150-350KB, sem perda visível de qualidade pra
   fins de registro de obra. */
function compressImage(file, { maxDimension = 1600, quality = 0.72 } = {}){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Falha ao ler o arquivo.'));
    reader.onload = () => {
      img.onerror = () => reject(new Error('Falha ao processar a imagem.'));
      img.onload = () => {
        let { width, height } = img;
        if(width > maxDimension || height > maxDimension){
          if(width >= height){ height = Math.round(height * (maxDimension / width)); width = maxDimension; }
          else{ width = Math.round(width * (maxDimension / height)); height = maxDimension; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob(blob => {
          if(!blob){ reject(new Error('Falha ao comprimir a imagem.')); return; }
          const compressedFile = new File([blob], file.name.replace(/\.(png|webp)$/i, '.jpg'), { type:'image/jpeg' });
          resolve(compressedFile);
        }, 'image/jpeg', quality);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

const locationService = {
  parseLatLng(url){
    if(!url) return null;
    let m = url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
    if(m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
    m = url.match(/q=(-?\d+\.\d+),(-?\d+\.\d+)/);
    if(m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
    m = url.match(/^\s*(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)\s*$/);
    if(m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
    return null;
  },
  staticMapEmbedUrl(coords){
    if(!coords) return null;
    const {lat,lng} = coords; const d = 0.006;
    return `https://www.openstreetmap.org/export/embed.html?bbox=${lng-d}%2C${lat-d}%2C${lng+d}%2C${lat+d}&layer=mapnik&marker=${lat}%2C${lng}`;
  }
};

const settingsService = {
  async get(){
    const { data, error } = await sb.from('settings').select('*').eq('id',1).maybeSingle();
    if(error) throw error;
    return data ? {
      companyName:data.company_name||'', phone:data.phone||'', whatsapp:data.whatsapp||'',
      email:data.email||'', address:data.address||'', city:data.city||'', state:data.state||''
    } : { companyName:'Ponto do Andaime', phone:'', whatsapp:'', email:'', address:'', city:'', state:'' };
  },
  async save(form){
    const { error } = await sb.from('settings').upsert({
      id:1, company_name:form.companyName, phone:form.phone, whatsapp:form.whatsapp,
      email:form.email, address:form.address, city:form.city, state:form.state
    });
    if(error) throw error;
  }
};

/* =========================================================================
   UTILITÁRIOS DE UI
   ========================================================================= */
function classNames(...a){ return a.filter(Boolean).join(' '); }
function maskDocument(v){
  const d = v.replace(/\D/g,'').slice(0,14);
  if(d.length <= 11) return d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
  return d.replace(/(\d{2})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{4})/,'$1/$2').replace(/(\d{4})(\d{1,2})$/,'$1-$2');
}
function maskPhone(v){
  const d = v.replace(/\D/g,'').slice(0,11);
  if(d.length <= 10) return d.replace(/(\d{2})(\d)/,'($1) $2').replace(/(\d{4})(\d{1,4})$/,'$1-$2');
  return d.replace(/(\d{2})(\d)/,'($1) $2').replace(/(\d{5})(\d{1,4})$/,'$1-$2');
}
function maskCEP(v){ return v.replace(/\D/g,'').slice(0,8).replace(/(\d{5})(\d{1,3})$/,'$1-$2'); }
function isValidEmail(v){ return !v || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
function digitsOnly(v){ return (v||'').replace(/\D/g,''); }
function whatsappHref(phone, message){
  const d = digitsOnly(phone);
  const full = d.length <= 11 ? '55'+d : d;
  return `https://wa.me/${full}${message ? '?text=' + encodeURIComponent(message) : ''}`;
}
function formatDate(d){
  if(!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('pt-BR');
}

/* Gera um CSV com BOM UTF-8 (pra acentuação abrir certo no Excel) e
   dispara o download direto no navegador — nada sai do dispositivo. */
function exportToCSV(filename, headers, rows){
  function escapeCell(value){
    let str = value === null || value === undefined ? '' : String(value);
    // Neutraliza "injeção de fórmula": se o Excel/Sheets abrir esse CSV e o
    // valor começar com =, +, -, @ ou tab, ele pode tentar executar como
    // fórmula em vez de mostrar como texto. Um apóstrofo na frente resolve.
    if(/^[=+\-@\t\r]/.test(str)) str = "'" + str;
    if(/[",;\n]/.test(str)) return '"' + str.replace(/"/g, '""') + '"';
    return str;
  }
  const lines = [headers.map(escapeCell).join(';'), ...rows.map(row => row.map(escapeCell).join(';'))];
  const csvContent = '\uFEFF' + lines.join('\r\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* Backup completo, em JSON, de tudo que está no banco — locações (com
   itens e os REGISTROS das fotos, não os arquivos em si), clientes, tipos
   de andaime e configurações. Não substitui um backup de verdade (a
   Supabase não oferece nenhum no plano gratuito), mas é um jeito rápido de
   ter uma cópia guardada fora do Supabase de vez em quando. */
async function downloadFullBackup(){
  const [rentalsRes, customersRes, typesRes, settingsRes] = await Promise.all([
    sb.from('rentals').select('*, photos(id, storage_path, description, created_at), rental_items(*)'),
    sb.from('customers').select('*'),
    sb.from('equipment_types').select('*'),
    sb.from('settings').select('*')
  ]);
  if(rentalsRes.error) throw rentalsRes.error;
  if(customersRes.error) throw customersRes.error;
  if(typesRes.error) throw typesRes.error;
  if(settingsRes.error) throw settingsRes.error;
  const backup = {
    generatedAt: new Date().toISOString(),
    note: 'Backup do Ponto do Andaime. NÃO inclui os arquivos de foto (só os registros/caminhos) — as fotos em si ficam no Supabase Storage.',
    rentals: rentalsRes.data, customers: customersRes.data, equipmentTypes: typesRes.data, settings: settingsRes.data
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `backup_ponto_do_andaime_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function useToasts(){
  const [toasts, setToasts] = useState([]);
  const push = useCallback((message, type='info')=>{
    const id = uid('t');
    setToasts(t => [...t, {id, message, type}]);
    setTimeout(()=> setToasts(t => t.filter(x=>x.id!==id)), 4200);
  },[]);
  const dismiss = (id)=> setToasts(t => t.filter(x=>x.id!==id));
  return { toasts, push, dismiss };
}

function LoginScreen({onLogin}){
  const [email, setEmail] = useState('');

  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  async function submit(e){
    e.preventDefault();
    setError('');
    if(!email || !password){ setError('Informe e-mail e senha.'); return; }
    setLoading(true);
    const res = await authService.login(email, password);
    setLoading(false);
    if(!res.ok){ setError(res.error); return; }
    onLogin(res.session);
  }

  return (
    <div style={{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'var(--charcoal)', padding:16,
      backgroundImage:'radial-gradient(circle at 20% 20%, #2A323A 0%, #1C2126 60%)'}}>

          <div style={{width:64, height:64, margin:'0 auto 14px', borderRadius:14, background:'linear-gradient(135deg, var(--safety), var(--safety-dark))',

          <div style={{color:'#9BA5AD', fontSize:13, marginTop:6, textTransform:'none', fontFamily:'Inter,sans-serif'}}>Gestão de locações de andaimes</div>
        </div>

        <form onSubmit={submit} style={{background:'#fff', borderRadius:14, padding:28, boxShadow:'0 20px 60px rgba(0,0,0,.4)'}}>
          <h2 style={{fontSize:15, margin:'0 0 18px', color:'var(--ink)'}}>Entrar</h2>
          <Field label="E-mail" required>
            <Input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="voce@empresa.com.br" autoComplete="username" />
          </Field>
          <Field label="Senha" required>
            <div style={{position:'relative'}}>
              <Input type={showPass ? 'text':'password'} value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••" autoComplete="current-password" style={{paddingRight:44}} />
              <button type="button" onClick={()=>setShowPass(s=>!s)} className="focus-ring" style={{position:'absolute', right:8, top:6, background:'none', border:'none', fontSize:18, padding:6}} aria-label="Mostrar senha">{showPass ? '🙈' : '👁️'}</button>
            </div>
          </Field>
          <label style={{display:'flex', alignItems:'center', gap:8, fontSize:13.5, color:'var(--ink-soft)', marginBottom:18, textTransform:'none'}}>
            <input type="checkbox" checked={showPass} onChange={e=>setShowPass(e.target.checked)} /> Mostrar senha
          </label>
          {error && <div style={{background:'#FBE6E3', color:'var(--danger)', padding:'10px 12px', borderRadius:8, fontSize:13.5, marginBottom:16, textTransform:'none'}}>⚠️ {error}</div>}
          <button type="submit" disabled={loading} className="focus-ring" style={{width:'100%', padding:'13px', borderRadius:9, border:'none', background:'var(--safety)', color:'#fff', fontWeight:700, fontSize:15, letterSpacing:'.02em', opacity: loading ? .7 : 1}}>
            {loading ? 'Entrando…' : 'Entrar'}
          </button>
          <div style={{marginTop:18, fontSize:12, color:'var(--ink-soft)', textTransform:'none', lineHeight:1.5}}>
            Acesso restrito. Novos usuários só podem ser criados pelo painel do Supabase (Authentication → Users), não por esta tela.

    </div>
  );
}

function exportRentalsCSV(rentals){
  const headers = ['Cliente','CPF/CNPJ','Telefone','WhatsApp','E-mail','Data da locação','Devolução prevista','Data de encerramento','Status','Itens','Endereço','Bairro','Cidade','Estado','CEP','Link localização','Qtd. fotos','Observações'];
  const rows = rentals.map(r => [
    r.customerName, r.document, r.phone, r.whatsapp, r.email, formatDate(r.rentalDate), formatDate(r.expectedReturnDate), r.manualStatus==='encerrada' ? formatDate(r.closedAt) : '',
    STATUS_META[r.status]?.label || r.status,
    r.items.map(i => `${i.equipmentType}${i.quantity ? ' ('+i.quantity+')' : ''}`).join(' | '),
    [r.address, r.number].filter(Boolean).join(', '), r.neighborhood, r.city, r.state, r.zipCode,
    r.locationUrl, r.photos.length, r.rentalNotes
  ]);
  exportToCSV(`locacoes_${new Date().toISOString().slice(0,10)}.csv`, headers, rows);
}

const BRAZIL_STATES = ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];

function EquipmentItemRow({item, index, catalog, onChange, onRemove, onTypeCreated, pushToast}){
  const [adding, setAdding] = useState(false);
  const [newTypeName, setNewTypeName] = useState('');
  const [creating, setCreating] = useState(false);

  function handleSelect(value){
    if(value === '__new__'){ setAdding(true); return; }
    onChange(index, 'equipmentType', value);
  }
  async function confirmNewType(){
    if(!newTypeName.trim()){ pushToast('Digite o nome do novo tipo.', 'error'); return; }
    setCreating(true);
    try{
      const created = await equipmentTypeService.create(newTypeName);
      onTypeCreated(created);
      onChange(index, 'equipmentType', created.name);
      setAdding(false); setNewTypeName('');
      pushToast(`"${created.name}" cadastrado no catálogo.`, 'success');
    }catch(err){ pushToast(err.message, 'error'); }
    finally{ setCreating(false); }
  }

  if(adding){
    return (
      <div style={{display:'flex', gap:8, marginBottom:8, flexWrap:'wrap', alignItems:'center', background:'var(--concrete)', padding:10, borderRadius:8}}>
        <Input autoFocus value={newTypeName} onChange={e=>setNewTypeName(e.target.value)} placeholder="Nome do novo tipo de andaime" style={{flex:'1 1 200px'}} />
        <button type="button" onClick={confirmNewType} disabled={creating} className="focus-ring" style={{padding:'10px 14px', borderRadius:7, border:'none', background:'var(--safety)', color:'#fff', fontWeight:700, fontSize:13}}>{creating?'Salvando…':'✓ Cadastrar'}</button>
        <button type="button" onClick={()=>{setAdding(false); setNewTypeName('');}} className="focus-ring" style={{padding:'10px 14px', borderRadius:7, border:'1px solid var(--steel-line)', background:'#fff', fontSize:13}}>Cancelar</button>
      </div>
    );
  }

  return (
    <div style={{display:'flex', gap:8, marginBottom:8, alignItems:'flex-start', flexWrap:'wrap'}}>
      <Select value={item.equipmentType} onChange={e=>handleSelect(e.target.value)} style={{flex:'2 1 200px'}}>
        <option value="">Selecione o tipo...</option>
        {catalog.map(t => <option key={t.id} value={t.name}>{t.name}</option>)}
        {item.equipmentType && !catalog.some(t=>t.name===item.equipmentType) && <option value={item.equipmentType}>{item.equipmentType}</option>}
        <option value="__new__">➕ Cadastrar novo tipo...</option>
      </Select>
      <Input value={item.quantity} onChange={e=>onChange(index, 'quantity', e.target.value)} placeholder="Qtd. (ex.: 20 torres)" style={{flex:'1 1 150px'}} />
      {onRemove && <button type="button" onClick={()=>onRemove(index)} className="focus-ring" style={{padding:'11px 13px', borderRadius:8, border:'1px solid #F3D3CD', background:'#FDF2F0', color:'var(--danger)'}}>🗑️</button>}
    </div>
  );
}

function RentalForm({initial, onCancel, onSaved, pushToast}){
  const isEdit = !!initial;
  const [form, setForm] = useState(() => initial ? {...initial, items: initial.items && initial.items.length ? initial.items : [{ id:uid('itm'), equipmentType:'', quantity:'' }]} : {
    customerName:'', document:'', phone:'', whatsapp:'', email:'', customerNotes:'',
    rentalDate: new Date().toISOString().slice(0,10), expectedReturnDate:'', items:[{ id:uid('itm'), equipmentType:'', quantity:'' }], description:'', rentalNotes:'',
    address:'', number:'', complement:'', neighborhood:'', city:'', state:'', zipCode:'', locationUrl:''
  });
  const [equipmentCatalog, setEquipmentCatalog] = useState([]);
  useEffect(() => { equipmentTypeService.list().then(setEquipmentCatalog).catch(err => pushToast('Erro ao carregar tipos de andaime: ' + err.message, 'error')); }, []);
  function updateItem(idx, field, value){
    setForm(f => ({...f, items: f.items.map((it,i) => i===idx ? {...it, [field]:value} : it)}));
  }
  function addItem(){ setForm(f => ({...f, items:[...f.items, { id:uid('itm'), equipmentType:'', quantity:'' }]})); }
  function removeItem(idx){ setForm(f => ({...f, items: f.items.filter((_,i)=>i!==idx)})); }
  function handleTypeCreated(newType){
    setEquipmentCatalog(c => [...c, newType].sort((a,b)=>a.name.localeCompare(b.name)));
  }
  const [existingPhotos, setExistingPhotos] = useState(initial ? initial.photos : []);
  const [existingUrls, setExistingUrls] = useState({});
  const [pendingPhotos, setPendingPhotos] = useState([]); // {tempId, file, previewUrl, description}
  const [compressing, setCompressing] = useState(false);
  const [loadingPhotos, setLoadingPhotos] = useState(isEdit);
  const [errors, setErrors] = useState({});
  const [saving, setSaving] = useState(false);
  const fileInputRef = useRef(null);
  const cameraInputRef = useRef(null);
  const [lightbox, setLightbox] = useState(null);
  const [customerSuggestions, setCustomerSuggestions] = useState([]);
  const [searchingCustomer, setSearchingCustomer] = useState(false);
  const [activeSearchField, setActiveSearchField] = useState(null); // 'name' | 'document' | null
  const customerSearchTimer = useRef(null);

  function triggerCustomerSearch(field, value){
    if(isEdit) return; // não sugere durante edição de uma locação já existente
    setActiveSearchField(field);
    if(customerSearchTimer.current) clearTimeout(customerSearchTimer.current);
    if(!value || value.trim().length < 2){ setCustomerSuggestions([]); return; }
    customerSearchTimer.current = setTimeout(async () => {
      setSearchingCustomer(true);
      try{ setCustomerSuggestions(await customerService.search(value)); }
      catch(err){ /* busca silenciosa: se falhar, só não sugere nada */ }
      finally{ setSearchingCustomer(false); }
    }, 350);
  }
  function onCustomerNameChange(value){ set('customerName', value); triggerCustomerSearch('name', value); }
  function onCustomerDocumentChange(value){ const masked = maskDocument(value); set('document', masked); triggerCustomerSearch('document', masked); }
  function pickCustomer(c){
    setForm(f => ({...f, customerName:c.name, document:c.document||'', phone:c.phone||'', whatsapp:c.whatsapp||'', email:c.email||'', customerNotes:c.notes||''}));
    setActiveSearchField(null);
    setCustomerSuggestions([]);
    pushToast(`Dados de "${c.name}" preenchidos automaticamente.`, 'success');
  }
  function CustomerSuggestionsList(){
    return (
      <div style={{position:'absolute', top:'100%', left:0, right:0, background:'#fff', border:'1px solid var(--steel-line)', borderRadius:8, marginTop:4, boxShadow:'0 8px 20px rgba(0,0,0,.12)', zIndex:10, maxHeight:220, overflowY:'auto'}}>
        {searchingCustomer ? (
          <div style={{padding:'10px 12px', fontSize:12.5, color:'var(--ink-soft)'}}>Buscando…</div>
        ) : customerSuggestions.map(c => (
          <button type="button" key={c.id} onMouseDown={()=>pickCustomer(c)} className="focus-ring" style={{display:'block', width:'100%', textAlign:'left', padding:'10px 12px', border:'none', background:'none', borderBottom:'1px solid #F0EEE8'}}>
            <div style={{fontWeight:700, fontSize:13.5}}>{c.name}</div>
            <div style={{fontSize:11.5, color:'var(--ink-soft)'}}>{[c.phone, c.document].filter(Boolean).join(' · ') || 'Cliente cadastrado'}</div>
          </button>
        ))}
      </div>
    );
  }

  useEffect(() => {
    if(!isEdit) return;
    let cancelled = false;
    (async () => {
      try{
        const urls = {};
        for(const p of existingPhotos){ urls[p.id] = await photoService.signedUrl(p.storagePath); }
        if(!cancelled) setExistingUrls(urls);
      }catch(err){ pushToast('Não foi possível carregar as fotos existentes: ' + err.message, 'error'); }
      finally{ if(!cancelled) setLoadingPhotos(false); }
    })();
    return () => { cancelled = true; };
  }, []);

  function set(field, value){ setForm(f => ({...f, [field]: value})); }

  function validate(){
    const e = {};
    if(!form.customerName.trim()) e.customerName = 'Informe o nome do cliente.';
    if(!form.phone.trim() && !form.whatsapp.trim()) e.phone = 'Informe telefone ou WhatsApp.';
    if(!form.rentalDate) e.rentalDate = 'Informe a data da locação.';
    if(!form.locationUrl.trim() && !form.address.trim()) e.address = 'Informe o endereço ou o link da localização.';
    if(!isValidEmail(form.email)) e.email = 'E-mail inválido.';
    setErrors(e);
    return Object.keys(e).length === 0;
  }

  async function handleFiles(fileList){
    const files = Array.from(fileList || []).filter(f => /image\/(jpeg|jpg|png|webp)/.test(f.type));
    if(files.length === 0) return;
    setCompressing(true);
    try{
      const compressed = await Promise.all(files.map(f => compressImage(f).catch(() => f)));
      const added = compressed.map(file => ({ tempId: uid('tmp'), file, previewUrl: URL.createObjectURL(file), description:'' }));
      setPendingPhotos(p => [...p, ...added]);
    } finally {
      setCompressing(false);
    }
  }
  function removePending(tempId){ setPendingPhotos(p => p.filter(x => x.tempId !== tempId)); }
  function updatePendingDesc(tempId, desc){ setPendingPhotos(p => p.map(x => x.tempId === tempId ? {...x, description:desc} : x)); }

  async function removeExisting(photo){
    try{
      await photoService.remove(photo.id, photo.storagePath);
      setExistingPhotos(p => p.filter(x => x.id !== photo.id));
      pushToast('Foto removida.', 'success');
    }catch(err){ pushToast('Erro ao remover foto: ' + err.message, 'error'); }
  }
  async function updateExistingDesc(photo, desc){
    setExistingPhotos(p => p.map(x => x.id === photo.id ? {...x, description:desc} : x));
    try{ await photoService.updateDescription(photo.id, desc); }
    catch(err){ pushToast('Erro ao salvar descrição: ' + err.message, 'error'); }
  }

  async function handleSave(e){
    e.preventDefault();
    if(!validate()){ pushToast('Verifique os campos obrigatórios destacados.', 'error'); return; }
    setSaving(true);
    try{
      let rental = isEdit ? await rentalService.update(form.id, form) : await rentalService.create(form);
      if(pendingPhotos.length){
        await photoService.uploadForRental(rental.id, pendingPhotos.map(p => p.file));
        for(const pp of pendingPhotos){ /* descrições pendentes ficam vazias por simplicidade; podem ser editadas depois */ }
      }
      pushToast(isEdit ? 'Locação atualizada com sucesso.' : 'Locação cadastrada com sucesso.', 'success');
      onSaved(rental.id);
    }catch(err){
      pushToast('Erro ao salvar: ' + err.message, 'error');
    }finally{
      setSaving(false);
    }
  }

  function clearForm(){
    setForm({ customerName:'', document:'', phone:'', whatsapp:'', email:'', customerNotes:'',
      rentalDate: new Date().toISOString().slice(0,10), expectedReturnDate:'', items:[{ id:uid('itm'), equipmentType:'', quantity:'' }], description:'', rentalNotes:'',
      address:'', number:'', complement:'', neighborhood:'', city:'', state:'', zipCode:'', locationUrl:'' });
    setPendingPhotos([]); setErrors({});
  }

  const whatsMsg = "Olá! Para concluirmos o cadastro da sua locação de andaimes, por favor, envie pelo WhatsApp a localização exata da obra. No WhatsApp, clique no botão de localização e envie sua localização atual ou a localização da obra.";
  const coords = locationService.parseLatLng(form.locationUrl);
  const embedUrl = locationService.staticMapEmbedUrl(coords);

  return (
    <form onSubmit={handleSave} className="fade-in" style={{display:'flex', flexDirection:'column', gap:16, paddingBottom:40}}>
      <Card>
        <h2 style={{fontSize:15, margin:'0 0 16px'}}>👤 Dados do cliente</h2>
        <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))', gap:0}}>
          <Field label="Nome completo / Razão social" required>
            <div style={{position:'relative'}}>
              <Input value={form.customerName} onChange={e=>onCustomerNameChange(e.target.value)} onFocus={()=>setActiveSearchField('name')} onBlur={()=>setTimeout(()=>setActiveSearchField(f=>f==='name'?null:f),150)} placeholder="Ex.: Construtora Vale Verde Ltda" autoComplete="off" />
              {activeSearchField==='name' && (searchingCustomer || customerSuggestions.length > 0) && <CustomerSuggestionsList />}
            </div>
            <span style={{display:'block', fontSize:11.5, color:'var(--ink-soft)', marginTop:4, textTransform:'none'}}>Já cadastrado antes? Comece a digitar o nome ou o CPF/CNPJ — os dados preenchem sozinhos.</span>
            {errors.customerName && <span style={{color:'var(--danger)', fontSize:12}}>{errors.customerName}</span>}
          </Field>
          <Field label="CPF / CNPJ">
            <div style={{position:'relative'}}>
              <Input value={form.document} onChange={e=>onCustomerDocumentChange(e.target.value)} onFocus={()=>setActiveSearchField('document')} onBlur={()=>setTimeout(()=>setActiveSearchField(f=>f==='document'?null:f),150)} placeholder="000.000.000-00" autoComplete="off" />
              {activeSearchField==='document' && (searchingCustomer || customerSuggestions.length > 0) && <CustomerSuggestionsList />}
            </div>
          </Field>
          <Field label="Telefone" required>
            <Input value={form.phone} onChange={e=>set('phone', maskPhone(e.target.value))} placeholder="(00) 00000-0000" />
            {errors.phone && <span style={{color:'var(--danger)', fontSize:12}}>{errors.phone}</span>}
          </Field>
          <Field label="WhatsApp"><Input value={form.whatsapp} onChange={e=>set('whatsapp', maskPhone(e.target.value))} placeholder="(00) 00000-0000" /></Field>
          <Field label="E-mail">
            <Input type="email" value={form.email} onChange={e=>set('email', e.target.value)} placeholder="cliente@empresa.com.br" />
            {errors.email && <span style={{color:'var(--danger)', fontSize:12}}>{errors.email}</span>}
          </Field>
        </div>
        <Field label="Observações do cliente"><Textarea value={form.customerNotes} onChange={e=>set('customerNotes', e.target.value)} placeholder="Observações gerais sobre o cliente..." /></Field>
      </Card>

      <Card>
        <h2 style={{fontSize:15, margin:'0 0 16px'}}>🏗️ Dados da locação</h2>

            <Input type="date" value={form.rentalDate} onChange={e=>set('rentalDate', e.target.value)} />

          </Field>
          <Field label="Devolução prevista"><Input type="date" value={form.expectedReturnDate} onChange={e=>set('expectedReturnDate', e.target.value)} /></Field>
        </div>

        <span style={{display:'block', fontSize:12.5, fontWeight:700, color:'var(--steel)', marginBottom:8, letterSpacing:'.02em'}}>Itens da locação</span>
        {form.items.map((item, idx) => (
          <EquipmentItemRow key={item.id} item={item} index={idx} catalog={equipmentCatalog}
            onChange={updateItem} onRemove={form.items.length > 1 ? removeItem : null}
            onTypeCreated={handleTypeCreated} pushToast={pushToast} />
        ))}
        <button type="button" onClick={addItem} className="focus-ring" style={{marginBottom:16, padding:'9px 16px', borderRadius:8, border:'1px dashed var(--steel-line)', background:'var(--concrete)', fontWeight:600, fontSize:13}}>+ Adicionar item</button>

        <Field label="Descrição dos equipamentos"><Textarea value={form.description} onChange={e=>set('description', e.target.value)} placeholder="Detalhes técnicos, altura, área coberta..." /></Field>
        <Field label="Observações da locação"><Textarea value={form.rentalNotes} onChange={e=>set('rentalNotes', e.target.value)} placeholder="Condições combinadas, prazos, etc." /></Field>
      </Card>

      <Card>
        <h2 style={{fontSize:15, margin:'0 0 4px'}}>📍 Localização da obra</h2>
        <p style={{fontSize:12.5, color:'var(--ink-soft)', margin:'0 0 16px', textTransform:'none'}}>Peça a localização pelo WhatsApp e cole o link recebido abaixo.</p>
        <a href={whatsappHref(form.whatsapp || form.phone, whatsMsg)} target="_blank" rel="noopener" className="focus-ring" style={{
          display:'inline-flex', alignItems:'center', gap:8, background:'#25D366', color:'#fff', padding:'11px 16px', borderRadius:8, fontWeight:700, fontSize:13.5, textDecoration:'none', marginBottom:18,
          opacity: (form.whatsapp||form.phone) ? 1 : .5, pointerEvents:(form.whatsapp||form.phone)?'auto':'none'
        }}>📍 Enviar solicitação de localização pelo WhatsApp</a>
        <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))', gap:0}}>
          <Field label="Endereço">
            <Input value={form.address} onChange={e=>set('address', e.target.value)} placeholder="Rua, Av., etc." />
            {errors.address && <span style={{color:'var(--danger)', fontSize:12}}>{errors.address}</span>}
          </Field>
          <Field label="Número"><Input value={form.number} onChange={e=>set('number', e.target.value)} /></Field>
          <Field label="Complemento"><Input value={form.complement} onChange={e=>set('complement', e.target.value)} /></Field>
          <Field label="Bairro"><Input value={form.neighborhood} onChange={e=>set('neighborhood', e.target.value)} /></Field>
          <Field label="Cidade"><Input value={form.city} onChange={e=>set('city', e.target.value)} /></Field>
          <Field label="Estado">
            <Select value={form.state} onChange={e=>set('state', e.target.value)}><option value="">UF</option>{BRAZIL_STATES.map(s => <option key={s} value={s}>{s}</option>)}</Select>
          </Field>
          <Field label="CEP"><Input value={form.zipCode} onChange={e=>set('zipCode', maskCEP(e.target.value))} placeholder="00000-000" /></Field>
        </div>
        <Field label="Link da localização" hint="Cole aqui o link que o cliente enviou pelo WhatsApp (Google Maps ou coordenadas).">
          <Input value={form.locationUrl} onChange={e=>set('locationUrl', e.target.value)} placeholder="https://maps.google.com/..." />
        </Field>
        {form.locationUrl && (
          <a href={form.locationUrl} target="_blank" rel="noopener" className="focus-ring" style={{display:'inline-flex', alignItems:'center', gap:6, color:'var(--safety)', fontWeight:700, fontSize:13.5, textDecoration:'none'}}>🗺️ Ver localização</a>
        )}
        {embedUrl && (
          <div style={{marginTop:14, borderRadius:10, overflow:'hidden', border:'1px solid var(--steel-line)'}}>
            <iframe title="Mapa da obra" src={embedUrl} style={{width:'100%', height:220, border:'none'}} loading="lazy"></iframe>
          </div>
        )}
      </Card>

      <Card>
        <h2 style={{fontSize:15, margin:'0 0 4px'}}>📷 Fotos dos andaimes</h2>
        <p style={{fontSize:12.5, color:'var(--ink-soft)', margin:'0 0 16px', textTransform:'none'}}>Formatos aceitos: JPG, JPEG, PNG, WEBP. As fotos são opcionais.</p>
        <div style={{display:'flex', gap:10, marginBottom:16, flexWrap:'wrap'}}>
          <button type="button" onClick={()=>fileInputRef.current.click()} className="focus-ring" style={{border:'1px dashed var(--steel-line)', background:'var(--concrete)', borderRadius:9, padding:'12px 18px', fontWeight:600, fontSize:13.5}}>🖼️ Selecionar fotos</button>
          <button type="button" onClick={()=>cameraInputRef.current.click()} className="focus-ring" style={{border:'none', background:'var(--steel)', color:'#fff', borderRadius:9, padding:'12px 18px', fontWeight:600, fontSize:13.5}}>📸 Tirar foto</button>
          <input ref={fileInputRef} type="file" accept="image/jpeg,image/png,image/webp" multiple hidden onChange={e=>handleFiles(e.target.files)} />
          <input ref={cameraInputRef} type="file" accept="image/*" capture="environment" hidden onChange={e=>handleFiles(e.target.files)} />
        </div>

        {loadingPhotos && <Spinner label="Carregando fotos…" />}
        {compressing && <Spinner label="Otimizando fotos…" />}

        {!loadingPhotos && existingPhotos.length === 0 && pendingPhotos.length === 0 ? (
          <div style={{textAlign:'center', padding:'28px', color:'var(--ink-soft)', fontSize:13.5, border:'1px dashed var(--steel-line)', borderRadius:10, textTransform:'none'}}>Nenhuma foto adicionada ainda.</div>
        ) : (
          <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(140px,1fr))', gap:12}}>
            {existingPhotos.map((p,i) => (
              <div key={p.id} style={{border:'1px solid var(--steel-line)', borderRadius:10, overflow:'hidden', background:'#fff'}}>
                {existingUrls[p.id] ? (
                  <img src={existingUrls[p.id]} onClick={()=>setLightbox(existingUrls[p.id])} alt={`Foto ${i+1}`} style={{width:'100%', height:110, objectFit:'cover', cursor:'zoom-in'}} />
                ) : <div style={{height:110, background:'#F0EEE8'}} />}
                <div style={{padding:8}}>
                  <input defaultValue={p.description} onBlur={e=>updateExistingDesc(p, e.target.value)} placeholder="Descrição (opcional)" className="focus-ring" style={{width:'100%', fontSize:12, border:'1px solid #EDEAE2', borderRadius:6, padding:'6px 8px'}} />
                  <button type="button" onClick={()=>removeExisting(p)} className="focus-ring" style={{marginTop:6, width:'100%', fontSize:11.5, color:'var(--danger)', background:'#FDF2F0', border:'1px solid #F3D3CD', borderRadius:6, padding:'5px'}}>🗑️ Remover</button>
                </div>
              </div>
            ))}
            {pendingPhotos.map((p,i) => (
              <div key={p.tempId} style={{border:'1px solid var(--caution)', borderRadius:10, overflow:'hidden', background:'#fff'}}>
                <img src={p.previewUrl} onClick={()=>setLightbox(p.previewUrl)} alt={`Nova foto ${i+1}`} style={{width:'100%', height:110, objectFit:'cover', cursor:'zoom-in'}} />
                <div style={{padding:8}}>
                  <div style={{fontSize:10.5, fontWeight:700, color:'var(--warn)', marginBottom:4}}>⏳ Será enviada ao salvar</div>
                  <button type="button" onClick={()=>removePending(p.tempId)} className="focus-ring" style={{width:'100%', fontSize:11.5, color:'var(--danger)', background:'#FDF2F0', border:'1px solid #F3D3CD', borderRadius:6, padding:'5px'}}>🗑️ Remover</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </Card>

      <div style={{display:'flex', gap:10, justifyContent:'flex-end', flexWrap:'wrap'}}>
        <button type="button" onClick={onCancel} className="focus-ring" style={{padding:'12px 20px', borderRadius:9, border:'1px solid var(--steel-line)', background:'#fff', fontWeight:600}}>Cancelar</button>
        <button type="button" onClick={clearForm} className="focus-ring" style={{padding:'12px 20px', borderRadius:9, border:'1px solid var(--steel-line)', background:'#fff', fontWeight:600}}>Limpar formulário</button>
        <button type="submit" disabled={saving} className="focus-ring" style={{padding:'12px 26px', borderRadius:9, border:'none', background:'var(--safety)', color:'#fff', fontWeight:700, opacity: saving?.7:1}}>
          {saving ? 'Salvando…' : (isEdit ? 'Salvar alterações' : 'Salvar')}
        </button>
      </div>

      {lightbox && (
        <div onClick={()=>setLightbox(null)} style={{position:'fixed', inset:0, background:'rgba(0,0,0,.85)', zIndex:200, display:'flex', alignItems:'center', justifyContent:'center', padding:20}}>
          <img src={lightbox} style={{maxWidth:'92vw', maxHeight:'88vh', borderRadius:10}} />
        </div>
      )}
    </form>
  );
}

function RentalDetails({rental, onBack, onEdit, onDeleteRequest, onStatusChanged, pushToast}){
  const [lightbox, setLightbox] = useState(null);
  const [urls, setUrls] = useState({});
  const [loadingPhotos, setLoadingPhotos] = useState(true);
  const [updatingStatus, setUpdatingStatus] = useState(false);
  const [closeModalOpen, setCloseModalOpen] = useState(false);
  const [closeDate, setCloseDate] = useState(() => new Date().toISOString().slice(0,10));

  async function confirmClose(){
    setUpdatingStatus(true);
    try{
      await rentalService.setManualStatus(rental.id, 'encerrada', closeDate);
      pushToast(`Locação encerrada com data de ${formatDate(closeDate)}.`, 'success');
      setCloseModalOpen(false);
      onStatusChanged();
    }catch(err){ pushToast('Erro ao encerrar: ' + err.message, 'error'); }
    finally{ setUpdatingStatus(false); }
  }
  async function reopen(){
    setUpdatingStatus(true);
    try{
      await rentalService.setManualStatus(rental.id, null);
      pushToast('Locação reaberta.', 'success');
      onStatusChanged();
    }catch(err){ pushToast('Erro ao reabrir: ' + err.message, 'error'); }
    finally{ setUpdatingStatus(false); }
  }

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try{
        const map = {};
        for(const p of rental.photos){ map[p.id] = await photoService.signedUrl(p.storagePath); }
        if(!cancelled) setUrls(map);
      }catch(err){ pushToast('Erro ao carregar fotos: ' + err.message, 'error'); }
      finally{ if(!cancelled) setLoadingPhotos(false); }
    })();
    return () => { cancelled = true; };
  }, [rental.id]);

  const coords = locationService.parseLatLng(rental.locationUrl);
  const embedUrl = locationService.staticMapEmbedUrl(coords);
  const fullAddress = [rental.address, rental.number].filter(Boolean).join(', ') + (rental.complement ? ` - ${rental.complement}` : '') + (rental.neighborhood ? `, ${rental.neighborhood}` : '') + (rental.city ? ` — ${rental.city}/${rental.state}` : '') + (rental.zipCode ? `, ${rental.zipCode}` : '');

  return (
    <div className="fade-in" style={{display:'flex', flexDirection:'column', gap:16, paddingBottom:30}}>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:10}}>
        <button onClick={onBack} className="focus-ring" style={{background:'none', border:'none', fontSize:13.5, fontWeight:700, color:'var(--steel)'}}>← Voltar para locações</button>
        <div style={{display:'flex', gap:8, flexWrap:'wrap'}}>
          {rental.manualStatus === 'encerrada' ? (
            <button onClick={reopen} disabled={updatingStatus} className="focus-ring" style={{padding:'9px 16px', borderRadius:8, border:'1px solid var(--steel-line)', background:'#fff', fontWeight:700, fontSize:13, opacity:updatingStatus?.7:1}}>🔓 Reabrir locação</button>
          ) : (
            <button onClick={()=>{setCloseDate(new Date().toISOString().slice(0,10)); setCloseModalOpen(true);}} disabled={updatingStatus} className="focus-ring" style={{padding:'9px 16px', borderRadius:8, border:'1px solid var(--steel-line)', background:'#fff', fontWeight:700, fontSize:13, opacity:updatingStatus?.7:1}}>✅ Marcar como encerrada</button>
          )}
          <button onClick={onEdit} className="focus-ring" style={{padding:'9px 16px', borderRadius:8, border:'1px solid var(--steel-line)', background:'#fff', fontWeight:700, fontSize:13}}>✏️ Editar locação</button>
          <button onClick={()=>onDeleteRequest(rental)} className="focus-ring" style={{padding:'9px 16px', borderRadius:8, border:'1px solid #F3D3CD', background:'#FDF2F0', color:'var(--danger)', fontWeight:700, fontSize:13}}>🗑️ Excluir</button>
        </div>
      </div>

      <Card>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', flexWrap:'wrap', gap:10, marginBottom:10}}>
          <div><h2 style={{fontSize:20, margin:0}}>{rental.customerName}</h2><div style={{fontSize:13, color:'var(--ink-soft)', marginTop:4}}>{rental.document || 'Documento não informado'}</div></div>
          <StatusBadge status={rental.status} />
        </div>
        <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))', gap:14, marginTop:14}}>
          <DetailItem label="Telefone" value={rental.phone} />
          <DetailItem label="WhatsApp" value={rental.whatsapp} link={rental.whatsapp ? whatsappHref(rental.whatsapp) : null} />
          <DetailItem label="E-mail" value={rental.email} />
        </div>
        {rental.customerNotes && <DetailItem label="Observações do cliente" value={rental.customerNotes} block />}
      </Card>

      <Card>
        <h3 style={{fontSize:14, margin:'0 0 14px', color:'var(--steel)'}}>🏗️ Dados da locação</h3>
        <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))', gap:14, marginBottom:14}}>
          <DetailItem label="Data da locação" value={formatDate(rental.rentalDate)} />
          <DetailItem label="Devolução prevista" value={formatDate(rental.expectedReturnDate)} />
          {rental.manualStatus === 'encerrada' && <DetailItem label="Encerrada em" value={formatDate(rental.closedAt)} />}
        </div>
        <div style={{fontSize:11.5, fontWeight:700, color:'var(--steel)', textTransform:'uppercase', letterSpacing:'.03em', marginBottom:6}}>Itens</div>
        {rental.items.length === 0 ? (
          <div style={{fontSize:13.5, color:'var(--ink-soft)'}}>Nenhum item registrado.</div>
        ) : (
          <ul style={{margin:'0 0 4px', paddingLeft:18, fontSize:14.5}}>
            {rental.items.map(i => (<li key={i.id}>{i.equipmentType}{i.quantity ? ` — ${i.quantity}` : ''}</li>))}
          </ul>
        )}
        {rental.description && <DetailItem label="Descrição dos equipamentos" value={rental.description} block />}
        {rental.rentalNotes && <DetailItem label="Observações da locação" value={rental.rentalNotes} block />}
      </Card>

      <Card>
        <h3 style={{fontSize:14, margin:'0 0 14px', color:'var(--steel)'}}>📍 Localização</h3>
        <div style={{fontSize:14.5, marginBottom:12}}>{fullAddress.replace(/^, |, $/,'') || 'Endereço não informado'}</div>
        {rental.locationUrl ? (
          <a href={rental.locationUrl} target="_blank" rel="noopener" className="focus-ring" style={{display:'inline-flex', gap:6, color:'var(--safety)', fontWeight:700, fontSize:13.5, textDecoration:'none', marginBottom:12}}>🗺️ Ver localização</a>
        ) : <div style={{fontSize:13, color:'var(--ink-soft)', marginBottom:12, textTransform:'none'}}>Nenhum link de localização registrado.</div>}
        {embedUrl && (
          <div style={{borderRadius:10, overflow:'hidden', border:'1px solid var(--steel-line)'}}>
            <iframe title="Mapa da obra" src={embedUrl} style={{width:'100%', height:240, border:'none'}} loading="lazy"></iframe>
          </div>
        )}
      </Card>

      <Card>
        <h3 style={{fontSize:14, margin:'0 0 14px', color:'var(--steel)'}}>📷 Fotos ({rental.photos.length})</h3>
        {loadingPhotos ? <Spinner label="Carregando fotos…" /> : rental.photos.length === 0 ? (
          <div style={{fontSize:13, color:'var(--ink-soft)', textTransform:'none'}}>Nenhuma foto cadastrada.</div>
        ) : (
          <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(140px,1fr))', gap:12}}>
            {rental.photos.map((p,i) => (
              <div key={p.id}>
                {urls[p.id] && <img src={urls[p.id]} onClick={()=>setLightbox(urls[p.id])} alt={`Foto ${i+1}`} style={{width:'100%', height:110, objectFit:'cover', borderRadius:8, cursor:'zoom-in', border:'1px solid var(--steel-line)'}} />}
                {p.description && <div style={{fontSize:11.5, color:'var(--ink-soft)', marginTop:4, textTransform:'none'}}>{p.description}</div>}
              </div>
            ))}
          </div>
        )}
      </Card>

      {lightbox && (
        <div onClick={()=>setLightbox(null)} style={{position:'fixed', inset:0, background:'rgba(0,0,0,.85)', zIndex:200, display:'flex', alignItems:'center', justifyContent:'center', padding:20}}>
          <img src={lightbox} style={{maxWidth:'92vw', maxHeight:'88vh', borderRadius:10}} />
        </div>
      )}

      {closeModalOpen && (
        <div style={{position:'fixed', inset:0, background:'rgba(28,33,38,.55)', zIndex:150, display:'flex', alignItems:'center', justifyContent:'center', padding:16}} onClick={()=>setCloseModalOpen(false)}>
          <div onClick={e=>e.stopPropagation()} className="fade-in" style={{background:'#fff', borderRadius:12, maxWidth:380, width:'100%', padding:24, boxShadow:'0 20px 60px rgba(0,0,0,.3)'}}>
            <h3 style={{margin:'0 0 8px', fontSize:17}}>Encerrar locação</h3>
            <p style={{margin:'0 0 14px', fontSize:13, color:'var(--ink-soft)', textTransform:'none', lineHeight:1.5}}>Em que data o andaime foi devolvido/retirado? Pode ser antes ou depois da devolução prevista ({formatDate(rental.expectedReturnDate)}).</p>
            <Field label="Data de encerramento"><Input type="date" value={closeDate} onChange={e=>setCloseDate(e.target.value)} /></Field>
            <div style={{display:'flex', gap:10, justifyContent:'flex-end', marginTop:8}}>
              <button onClick={()=>setCloseModalOpen(false)} className="focus-ring" style={{padding:'10px 18px', borderRadius:8, border:'1px solid var(--steel-line)', background:'#fff', fontWeight:600}}>Cancelar</button>
              <button onClick={confirmClose} disabled={updatingStatus || !closeDate} className="focus-ring" style={{padding:'10px 20px', borderRadius:8, border:'none', background:'var(--safety)', color:'#fff', fontWeight:700, opacity:updatingStatus?.7:1}}>{updatingStatus?'Salvando…':'Confirmar encerramento'}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
function DetailItem({label, value, block, link}){
  return (
    <div style={{gridColumn: block ? '1/-1' : 'auto', marginTop: block ? 10 : 0}}>
      <div style={{fontSize:11.5, fontWeight:700, color:'var(--steel)', textTransform:'uppercase', letterSpacing:'.03em', marginBottom:4}}>{label}</div>
      {link ? <a href={link} target="_blank" rel="noopener" style={{fontSize:14.5, color:'var(--safety)', fontWeight:700, textDecoration:'none'}}>{value || '—'}</a>
            : <div style={{fontSize:14.5, color: value ? 'var(--ink)' : 'var(--ink-soft)', lineHeight:1.5}}>{value || '—'}</div>}
    </div>
  );
}

function exportCustomersCSV(customers){
  const headers = ['Nome','CPF/CNPJ','Telefone','WhatsApp','E-mail','Observações'];
  const rows = customers.map(c => [c.name, c.document, c.phone, c.whatsapp, c.email, c.notes]);
  exportToCSV(`clientes_${new Date().toISOString().slice(0,10)}.csv`, headers, rows);
}

function ClientsScreen({rentals, onOpenRental, pushToast}){
  const [customers, setCustomers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [query, setQuery] = useState('');
  const [editing, setEditing] = useState(null); // customer object ou {} pra novo
  const [deleteTarget, setDeleteTarget] = useState(null);
  const [deleting, setDeleting] = useState(false);
  const [historyCustomer, setHistoryCustomer] = useState(null);

  const load = useCallback(async () => {
    setLoading(true);
    try{ setCustomers(await customerService.list()); }
    catch(err){ pushToast('Erro ao carregar clientes: ' + err.message, 'error'); }
    finally{ setLoading(false); }
  }, [pushToast]);

  useEffect(() => { load(); }, [load]);

  function rentalsOf(customer){
    return rentals
      .filter(r => (r.customerId && r.customerId === customer.id) || (customer.document && customer.document.trim() && r.document === customer.document))
      .sort((a,b)=> new Date(b.rentalDate||b.createdAt) - new Date(a.rentalDate||a.createdAt));
  }

  const filtered = customers.filter(c => {
    const q = query.trim().toLowerCase();
    return !q || c.name.toLowerCase().includes(q) || (c.phone||'').includes(q) || (c.document||'').includes(q);
  });

  async function handleDelete(){
    setDeleting(true);
    try{
      await customerService.remove(deleteTarget.id);
      pushToast('Cliente removido do cadastro. O histórico de locações antigas dele continua intacto.', 'success');
      setDeleteTarget(null);
      load();
    }catch(err){ pushToast('Erro ao remover: ' + err.message, 'error'); }
    finally{ setDeleting(false); }
  }

  return (
    <div className="fade-in">
      <div style={{display:'flex', gap:10, marginBottom:16, flexWrap:'wrap', alignItems:'center'}}>
        <div style={{flex:'1 1 240px', position:'relative'}}>
          <span style={{position:'absolute', left:12, top:11.5, opacity:.5}}>🔎</span>
          <Input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Pesquisar por nome, telefone ou documento..." style={{paddingLeft:36}} />
        </div>
        <button onClick={()=>exportCustomersCSV(filtered)} disabled={filtered.length===0} className="focus-ring" title="Exportar clientes filtrados para CSV/Excel" style={{padding:'11px 16px', borderRadius:8, border:'1px solid var(--steel-line)', background:'#fff', fontWeight:700, fontSize:13.5, opacity:filtered.length===0?.5:1}}>📤 Exportar CSV</button>
        <button onClick={()=>setEditing({})} className="focus-ring" style={{background:'var(--safety)', color:'#fff', border:'none', padding:'11px 18px', borderRadius:8, fontWeight:700, fontSize:13.5}}>+ Novo Cliente</button>
      </div>

      {loading ? <Spinner label="Carregando clientes…" /> : filtered.length === 0 ? (
        <Card><EmptyState icon="👥" title="Nenhum cliente cadastrado" message="Clientes aparecem aqui automaticamente quando você cadastra uma locação — ou cadastre um manualmente." actionLabel="+ Novo Cliente" onAction={()=>setEditing({})} /></Card>
      ) : (
        <div style={{display:'flex', flexDirection:'column', gap:10}}>
          {filtered.map(c => {
            const history = rentalsOf(c);
            return (
              <Card key={c.id}>
                <div style={{display:'flex', justifyContent:'space-between', gap:10, flexWrap:'wrap'}}>
                  <div style={{minWidth:0}}>
                    <div style={{fontWeight:700, fontSize:15}}>{c.name}</div>
                    <div style={{fontSize:13, color:'var(--ink-soft)', marginTop:2}}>{[c.phone, c.document].filter(Boolean).join(' · ') || 'Sem telefone/documento'}</div>
                    {c.email && <div style={{fontSize:12.5, color:'var(--ink-soft)', marginTop:2}}>{c.email}</div>}
                    <div style={{marginTop:8}}>
                      {history.length === 0 ? (
                        <span style={{fontSize:12, color:'var(--ink-soft)'}}>Nenhuma locação registrada ainda</span>
                      ) : (
                        <span style={{fontSize:12, fontWeight:700, color:'var(--safety-dark)', background:'#FBEADD', padding:'3px 9px', borderRadius:20}}>
                          🏗️ {history.length} locação{history.length>1?'ões':''} · última em {formatDate(history[0].rentalDate)}
                        </span>
                      )}
                    </div>
                  </div>
                  <div style={{display:'flex', gap:8, flexShrink:0}}>
                    <button onClick={()=>setHistoryCustomer(c)} disabled={history.length===0} className="focus-ring" style={{padding:'8px 12px', borderRadius:7, border:'1px solid var(--steel-line)', background:'#fff', fontSize:12.5, fontWeight:600, opacity:history.length===0?.5:1}}>📜 Histórico</button>
                    <button onClick={()=>setEditing(c)} className="focus-ring" style={{padding:'8px 12px', borderRadius:7, border:'1px solid var(--steel-line)', background:'#fff', fontSize:12.5, fontWeight:600}}>✏️ Editar</button>
                    <button onClick={()=>setDeleteTarget(c)} className="focus-ring" style={{padding:'8px 12px', borderRadius:7, border:'1px solid #F3D3CD', background:'#FDF2F0', color:'var(--danger)', fontSize:12.5, fontWeight:600}}>🗑️</button>
                  </div>
                </div>
              </Card>
            );
          })}
        </div>
      )}

      {editing && <ClientEditModal customer={editing} onClose={()=>setEditing(null)} onSaved={()=>{ setEditing(null); load(); }} pushToast={pushToast} />}

      {historyCustomer && (
        <ClientHistoryModal customer={historyCustomer} rentals={rentalsOf(historyCustomer)} onClose={()=>setHistoryCustomer(null)}
          onOpenRental={(id)=>{ setHistoryCustomer(null); onOpenRental(id); }} />
      )}

      <ConfirmModal open={!!deleteTarget} busy={deleting} title="Remover cliente"
        message={deleteTarget ? `Remover "${deleteTarget.name}" do cadastro de clientes? As locações já registradas para ele NÃO são apagadas, só o atalho de preenchimento automático.` : ''}
        confirmLabel="Remover" onConfirm={handleDelete} onCancel={()=>setDeleteTarget(null)} />
    </div>
  );
}
