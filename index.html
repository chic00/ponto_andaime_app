function ClientEditModal({customer, onClose, onSaved, pushToast}){
  const isNew = !customer.id;
  const [form, setForm] = useState({ name:customer.name||'', document:customer.document||'', phone:customer.phone||'', whatsapp:customer.whatsapp||'', email:customer.email||'', notes:customer.notes||'' });
  const [saving, setSaving] = useState(false);
  function set(f,v){ setForm(s=>({...s,[f]:v})); }
  async function save(e){
    e.preventDefault();
    if(!form.name.trim()){ pushToast('Informe o nome do cliente.', 'error'); return; }
    setSaving(true);
    try{
      if(isNew) await customerService.create(form);
      else await customerService.update(customer.id, form);
      pushToast('Cliente salvo com sucesso.', 'success');
      onSaved();
    }catch(err){ pushToast('Erro ao salvar: ' + err.message, 'error'); }
    finally{ setSaving(false); }
  }
  return (
    <div style={{position:'fixed', inset:0, background:'rgba(28,33,38,.55)', zIndex:150, display:'flex', alignItems:'center', justifyContent:'center', padding:16}} onClick={onClose}>
      <form onSubmit={save} onClick={e=>e.stopPropagation()} className="fade-in" style={{background:'#fff', borderRadius:14, maxWidth:480, width:'100%', padding:24, boxShadow:'0 20px 60px rgba(0,0,0,.3)', maxHeight:'90vh', overflowY:'auto'}}>
        <h3 style={{margin:'0 0 18px', fontSize:18}}>{isNew ? 'Novo cliente' : 'Editar cliente'}</h3>
        <Field label="Nome completo / Razão social" required><Input value={form.name} onChange={e=>set('name', e.target.value)} /></Field>
        <Field label="CPF / CNPJ"><Input value={form.document} onChange={e=>set('document', maskDocument(e.target.value))} /></Field>
        <Field label="Telefone"><Input value={form.phone} onChange={e=>set('phone', maskPhone(e.target.value))} /></Field>
        <Field label="WhatsApp"><Input value={form.whatsapp} onChange={e=>set('whatsapp', maskPhone(e.target.value))} /></Field>
        <Field label="E-mail"><Input type="email" value={form.email} onChange={e=>set('email', e.target.value)} /></Field>
        <Field label="Observações"><Textarea value={form.notes} onChange={e=>set('notes', e.target.value)} /></Field>
        <div style={{display:'flex', gap:10, justifyContent:'flex-end', marginTop:8}}>
          <button type="button" onClick={onClose} className="focus-ring" style={{padding:'10px 18px', borderRadius:8, border:'1px solid var(--steel-line)', background:'#fff', fontWeight:600}}>Cancelar</button>
          <button type="submit" disabled={saving} className="focus-ring" style={{padding:'10px 20px', borderRadius:8, border:'none', background:'var(--safety)', color:'#fff', fontWeight:700, opacity:saving?.7:1}}>{saving?'Salvando…':'Salvar'}</button>
        </div>
      </form>
    </div>
  );
}


function SettingsScreen({pushToast}){
  const [form, setForm] = useState(null);
  const [saving, setSaving] = useState(false);
  const [backingUp, setBackingUp] = useState(false);
  const [days, setDays] = useState(30);
  const [candidates, setCandidates] = useState(null);
  const [checkingCleanup, setCheckingCleanup] = useState(false);
  const [cleaning, setCleaning] = useState(false);
  const [confirmCleanup, setConfirmCleanup] = useState(false);

  useEffect(() => { settingsService.get().then(setForm).catch(err => pushToast('Erro ao carregar configurações: ' + err.message, 'error')); }, []);
  function set(f,v){ setForm(s=>({...s,[f]:v})); }
  async function save(e){
    e.preventDefault();
    setSaving(true);
    try{ await settingsService.save(form); pushToast('Configurações salvas com sucesso.', 'success'); }
    catch(err){ pushToast('Erro ao salvar: ' + err.message, 'error'); }
    finally{ setSaving(false); }
  }
  async function handleBackup(){
    setBackingUp(true);
    try{ await downloadFullBackup(); pushToast('Backup baixado. Guarde esse arquivo fora do Supabase (Google Drive, e-mail, etc.).', 'success'); }
    catch(err){ pushToast('Erro ao gerar backup: ' + err.message, 'error'); }
    finally{ setBackingUp(false); }
  }

  async function checkCleanup(){
    setCheckingCleanup(true);
    setCandidates(null);
    try{
      const found = await photoService.findOldPhotoCandidates(Number(days) || 30);
      setCandidates(found);
      if(found.length === 0) pushToast('Nenhuma foto passou do prazo definido.', 'info');
    }catch(err){ pushToast('Erro ao verificar: ' + err.message, 'error'); }
    finally{ setCheckingCleanup(false); }
  }
  async function runCleanup(){
    setCleaning(true);
    try{
      const removed = await photoService.cleanupOldPhotos(candidates);
      pushToast(`${removed} foto(s) removida(s) de ${candidates.length} locação(ões). As locações continuam no histórico.`, 'success');
      setCandidates(null);
    }catch(err){ pushToast('Erro ao limpar: ' + err.message, 'error'); }
    finally{ setCleaning(false); setConfirmCleanup(false); }
  }

  if(!form) return <Spinner label="Carregando configurações…" />;
  return (
    <div className="fade-in" style={{display:'flex', flexDirection:'column', gap:16}}>
    <form onSubmit={save}>
      <Card style={{maxWidth:560}}>
        <h2 style={{fontSize:15, margin:'0 0 16px'}}>⚙️ Dados da empresa</h2>
        <Field label="Nome da empresa"><Input value={form.companyName} onChange={e=>set('companyName', e.target.value)} /></Field>
        <Field label="Telefone"><Input value={form.phone} onChange={e=>set('phone', maskPhone(e.target.value))} /></Field>
        <Field label="WhatsApp" hint="Número usado nas solicitações de localização enviadas ao cliente."><Input value={form.whatsapp} onChange={e=>set('whatsapp', maskPhone(e.target.value))} /></Field>
        <Field label="E-mail"><Input type="email" value={form.email} onChange={e=>set('email', e.target.value)} /></Field>
        <Field label="Endereço"><Input value={form.address} onChange={e=>set('address', e.target.value)} /></Field>
        <div style={{display:'grid', gridTemplateColumns:'2fr 1fr', gap:14}}>
          <Field label="Cidade"><Input value={form.city} onChange={e=>set('city', e.target.value)} /></Field>
          <Field label="Estado"><Select value={form.state} onChange={e=>set('state', e.target.value)}><option value="">UF</option>{BRAZIL_STATES.map(s=><option key={s} value={s}>{s}</option>)}</Select></Field>
        </div>
        <button type="submit" disabled={saving} className="focus-ring" style={{marginTop:8, padding:'11px 22px', borderRadius:8, border:'none', background:'var(--safety)', color:'#fff', fontWeight:700}}>
          {saving ? 'Salvando…' : 'Salvar configurações'}
        </button>
      </Card>
    </form>

    <Card style={{maxWidth:560}}>
      <h2 style={{fontSize:15, margin:'0 0 6px'}}>💾 Backup completo</h2>
      <p style={{fontSize:12.5, color:'var(--ink-soft)', margin:'0 0 16px', textTransform:'none', lineHeight:1.5}}>
        O Supabase no plano gratuito não faz backup automático de nada. Baixe este arquivo de vez em quando (ex.: uma vez por mês) e guarde num lugar fora do Supabase — Google Drive, e-mail pra você mesmo, etc. Inclui clientes, locações, itens e tipos de andaime. Não inclui os arquivos de foto em si (só o registro deles).
      </p>
      <button type="button" onClick={handleBackup} disabled={backingUp} className="focus-ring" style={{padding:'11px 20px', borderRadius:8, border:'none', background:'var(--steel)', color:'#fff', fontWeight:700, fontSize:13.5, opacity:backingUp?.7:1}}>
        {backingUp ? 'Gerando…' : '📦 Baixar backup completo'}
      </button>
    </Card>

    <Card style={{maxWidth:560}}>
      <h2 style={{fontSize:15, margin:'0 0 6px'}}>🧹 Limpar fotos antigas</h2>
      <p style={{fontSize:12.5, color:'var(--ink-soft)', margin:'0 0 16px', textTransform:'none', lineHeight:1.5}}>
        Apaga só as FOTOS (não a locação) de obras cuja devolução já passou há mais de X dias. Útil para liberar espaço de armazenamento — nada aqui roda sozinho, você decide quando rodar.
      </p>
      <div style={{display:'flex', gap:10, alignItems:'flex-end', flexWrap:'wrap', marginBottom:14}}>
        <Field label="Fotos com devolução há mais de (dias)" hint="">
          <Input type="number" min="1" value={days} onChange={e=>setDays(e.target.value)} style={{width:120}} />
        </Field>
        <button type="button" onClick={checkCleanup} disabled={checkingCleanup} className="focus-ring" style={{padding:'11px 18px', borderRadius:8, border:'1px solid var(--steel-line)', background:'#fff', fontWeight:700, fontSize:13.5, marginBottom:16}}>
          {checkingCleanup ? 'Verificando…' : '🔍 Verificar'}
        </button>
      </div>

      {candidates && candidates.length > 0 && (
        <div style={{background:'var(--concrete)', borderRadius:10, padding:14, marginBottom:14}}>
          <div style={{fontWeight:700, fontSize:13.5, marginBottom:8}}>{candidates.reduce((s,c)=>s+c.photoCount,0)} foto(s) em {candidates.length} locação(ões) serão apagadas:</div>
          <ul style={{margin:0, paddingLeft:18, fontSize:12.5, color:'var(--ink-soft)', maxHeight:160, overflowY:'auto'}}>
            {candidates.map(c => (<li key={c.rentalId}>{c.customerName} — {c.photoCount} foto(s), devolução em {formatDate(c.referenceDate)}</li>))}
          </ul>
          <button type="button" onClick={()=>setConfirmCleanup(true)} className="focus-ring" style={{marginTop:12, padding:'10px 18px', borderRadius:8, border:'none', background:'var(--danger)', color:'#fff', fontWeight:700, fontSize:13.5}}>🗑️ Apagar essas fotos</button>
        </div>
      )}

      <ConfirmModal open={confirmCleanup} busy={cleaning} title="Apagar fotos antigas"
        message={candidates ? `Confirma apagar ${candidates.reduce((s,c)=>s+c.photoCount,0)} foto(s) de ${candidates.length} locação(ões)? As locações continuam no histórico, só as fotos somem. Isso não pode ser desfeito.` : ''}
        confirmLabel="Apagar fotos" onConfirm={runCleanup} onCancel={()=>setConfirmCleanup(false)} />
    </Card>

    <EquipmentTypesCard pushToast={pushToast} />
    <TrashCard pushToast={pushToast} />
    </div>
  );
}

function TrashCard({pushToast}){
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [restoringId, setRestoringId] = useState(null);
  const [purgeTarget, setPurgeTarget] = useState(null);
  const [purging, setPurging] = useState(false);
  const [purgingOld, setPurgingOld] = useState(false);

  const load = useCallback(async () => {
    setLoading(true);
    try{ setItems(await rentalService.listTrash()); }
    catch(err){ pushToast('Erro ao carregar lixeira: ' + err.message, 'error'); }
    finally{ setLoading(false); }
  }, [pushToast]);
  useEffect(() => { load(); }, [load]);

  async function restore(id){
    setRestoringId(id);
    try{ await rentalService.restore(id); pushToast('Locação restaurada.', 'success'); load(); }
    catch(err){ pushToast('Erro ao restaurar: ' + err.message, 'error'); }
    finally{ setRestoringId(null); }
  }
  async function confirmPurge(){
    setPurging(true);
    try{ await rentalService.purge(purgeTarget.id); pushToast('Locação apagada de vez.', 'success'); setPurgeTarget(null); load(); }
    catch(err){ pushToast('Erro ao apagar: ' + err.message, 'error'); }
    finally{ setPurging(false); }
  }
  const old = items.filter(i => (Date.now() - new Date(i.deletedAt).getTime()) > 1000*60*60*24*30);
  async function purgeOld(){
    setPurgingOld(true);
    try{
      for(const it of old){ await rentalService.purge(it.id); }
      pushToast(`${old.length} locação(ões) com mais de 30 dias na lixeira foram apagadas de vez.`, 'success');
      load();
    }catch(err){ pushToast('Erro ao esvaziar: ' + err.message, 'error'); }
    finally{ setPurgingOld(false); }
  }

  return (
    <Card style={{maxWidth:560}}>
      <h2 style={{fontSize:15, margin:'0 0 6px'}}>🗑️ Lixeira</h2>
      <p style={{fontSize:12.5, color:'var(--ink-soft)', margin:'0 0 16px', textTransform:'none', lineHeight:1.5}}>
        Locações excluídas ficam aqui, recuperáveis, em vez de somem na hora. Nada aqui é apagado de vez sozinho — só quando você mandar.
      </p>
      {loading ? <Spinner label="Carregando lixeira…" /> : items.length === 0 ? (
        <div style={{fontSize:13, color:'var(--ink-soft)'}}>A lixeira está vazia.</div>
      ) : (
        <>
          {old.length > 0 && (
            <button type="button" onClick={purgeOld} disabled={purgingOld} className="focus-ring" style={{marginBottom:12, padding:'9px 16px', borderRadius:8, border:'1px solid #F3D3CD', background:'#FDF2F0', color:'var(--danger)', fontWeight:700, fontSize:12.5}}>
              {purgingOld ? 'Apagando…' : `🗑️ Esvaziar ${old.length} item(ns) com mais de 30 dias`}
            </button>
          )}
          <div style={{display:'flex', flexDirection:'column', gap:8, maxHeight:280, overflowY:'auto'}}>
            {items.map(it => (
              <div key={it.id} style={{display:'flex', justifyContent:'space-between', alignItems:'center', gap:10, border:'1px solid var(--steel-line)', borderRadius:9, padding:10, flexWrap:'wrap'}}>
                <div style={{minWidth:0}}>
                  <div style={{fontWeight:700, fontSize:13.5}}>{it.customerName}</div>
                  <div style={{fontSize:11.5, color:'var(--ink-soft)'}}>Excluída em {formatDate(it.deletedAt ? it.deletedAt.slice(0,10) : '')}</div>
                </div>
                <div style={{display:'flex', gap:6}}>
                  <button onClick={()=>restore(it.id)} disabled={restoringId===it.id} className="focus-ring" style={{padding:'7px 11px', borderRadius:7, border:'1px solid var(--steel-line)', background:'#fff', fontSize:12, fontWeight:600}}>♻️ Restaurar</button>
                  <button onClick={()=>setPurgeTarget(it)} className="focus-ring" style={{padding:'7px 11px', borderRadius:7, border:'1px solid #F3D3CD', background:'#FDF2F0', color:'var(--danger)', fontSize:12, fontWeight:600}}>🗑️ Apagar de vez</button>
                </div>
              </div>
            ))}
          </div>
        </>
      )}
      <ConfirmModal open={!!purgeTarget} busy={purging} title="Apagar de vez"
        message={purgeTarget ? `Apagar "${purgeTarget.customerName}" definitivamente, incluindo as fotos? Isso NÃO pode ser desfeito de jeito nenhum.` : ''}
        confirmLabel="Apagar de vez" onConfirm={confirmPurge} onCancel={()=>setPurgeTarget(null)} />
    </Card>
  );
}

function EquipmentTypesCard({pushToast}){
  const [types, setTypes] = useState([]);
  const [loading, setLoading] = useState(true);
  const [selectedIds, setSelectedIds] = useState([]);
  const [merging, setMerging] = useState(false);
  const [mergeModalOpen, setMergeModalOpen] = useState(false);
  const [finalName, setFinalName] = useState('');

  const load = useCallback(async () => {
    setLoading(true);
    try{ setTypes(await equipmentTypeService.list()); }
    catch(err){ pushToast('Erro ao carregar tipos: ' + err.message, 'error'); }
    finally{ setLoading(false); }
  }, [pushToast]);
  useEffect(() => { load(); }, [load]);

  function toggle(id){
    setSelectedIds(ids => ids.includes(id) ? ids.filter(x=>x!==id) : [...ids, id]);
  }
  function openMergeModal(){
    const selected = types.filter(t => selectedIds.includes(t.id));
    setFinalName(selected[0]?.name || '');
    setMergeModalOpen(true);
  }
  async function confirmMerge(){
    const selected = types.filter(t => selectedIds.includes(t.id));
    setMerging(true);
    try{
      await equipmentTypeService.merge(selected, finalName);
      pushToast(`${selected.length} tipos mesclados em "${finalName.trim()}".`, 'success');
      setSelectedIds([]); setMergeModalOpen(false);
      load();
    }catch(err){ pushToast('Erro ao mesclar: ' + err.message, 'error'); }
    finally{ setMerging(false); }
  }

  return (
    <Card style={{maxWidth:560}}>
      <h2 style={{fontSize:15, margin:'0 0 6px'}}>🏗️ Tipos de andaime</h2>
      <p style={{fontSize:12.5, color:'var(--ink-soft)', margin:'0 0 16px', textTransform:'none', lineHeight:1.5}}>
        Selecione 2 ou mais tipos "parecidos" (ex.: escritos com maiúscula diferente ou espaço a mais) para juntá-los num só. Locações antigas que usavam os tipos antigos passam a mostrar o nome final.
      </p>
      {loading ? <Spinner label="Carregando tipos…" /> : types.length === 0 ? (
        <div style={{fontSize:13, color:'var(--ink-soft)'}}>Nenhum tipo cadastrado ainda.</div>
      ) : (
        <div style={{display:'flex', flexDirection:'column', gap:6, marginBottom:14, maxHeight:260, overflowY:'auto'}}>
          {types.map(t => (
            <label key={t.id} style={{display:'flex', alignItems:'center', gap:10, padding:'8px 10px', borderRadius:7, background: selectedIds.includes(t.id) ? 'var(--concrete)' : 'transparent', cursor:'pointer'}}>
              <input type="checkbox" checked={selectedIds.includes(t.id)} onChange={()=>toggle(t.id)} />
              <span style={{fontSize:13.5}}>{t.name}</span>
            </label>
          ))}
        </div>
      )}
      <button type="button" onClick={openMergeModal} disabled={selectedIds.length < 2} className="focus-ring" style={{padding:'10px 18px', borderRadius:8, border:'none', background: selectedIds.length<2 ? '#DADFE2' : 'var(--safety)', color:'#fff', fontWeight:700, fontSize:13.5}}>
        🔗 Mesclar selecionados ({selectedIds.length})
      </button>

      {mergeModalOpen && (
        <div style={{position:'fixed', inset:0, background:'rgba(28,33,38,.55)', zIndex:150, display:'flex', alignItems:'center', justifyContent:'center', padding:16}} onClick={()=>setMergeModalOpen(false)}>
          <div onClick={e=>e.stopPropagation()} className="fade-in" style={{background:'#fff', borderRadius:12, maxWidth:420, width:'100%', padding:24, boxShadow:'0 20px 60px rgba(0,0,0,.3)'}}>
            <h3 style={{margin:'0 0 8px', fontSize:17}}>Mesclar tipos</h3>
            <p style={{margin:'0 0 14px', fontSize:13, color:'var(--ink-soft)', textTransform:'none', lineHeight:1.5}}>
              {types.filter(t=>selectedIds.includes(t.id)).map(t=>t.name).join(', ')} vão virar um só. Escolha (ou digite) o nome final:
            </p>
            <Input value={finalName} onChange={e=>setFinalName(e.target.value)} list="merge-suggestions" />
            <datalist id="merge-suggestions">
              {types.filter(t=>selectedIds.includes(t.id)).map(t => <option key={t.id} value={t.name} />)}
            </datalist>
            <div style={{display:'flex', gap:10, justifyContent:'flex-end', marginTop:18}}>
              <button onClick={()=>setMergeModalOpen(false)} className="focus-ring" style={{padding:'10px 18px', borderRadius:8, border:'1px solid var(--steel-line)', background:'#fff', fontWeight:600}}>Cancelar</button>
              <button onClick={confirmMerge} disabled={merging} className="focus-ring" style={{padding:'10px 18px', borderRadius:8, border:'none', background:'var(--safety)', color:'#fff', fontWeight:700, opacity:merging?.7:1}}>{merging?'Mesclando…':'Confirmar'}</button>
            </div>
          </div>
        </div>
      )}
    </Card>
  );
}

function App(){
  const [session, setSession] = useState(null);
  const [checkingSession, setCheckingSession] = useState(true);
  const [screen, setScreen] = useState('dashboard');
  const [rentals, setRentals] = useState([]);
  const [loadingRentals, setLoadingRentals] = useState(false);
  const [activeRentalId, setActiveRentalId] = useState(null);
  const [activeRental, setActiveRental] = useState(null);
  const [editingRentalId, setEditingRentalId] = useState(null);
  const [editingRental, setEditingRental] = useState(null);
  const [deleteTarget, setDeleteTarget] = useState(null);
  const [deleting, setDeleting] = useState(false);
  const { toasts, push, dismiss } = useToasts();

  useEffect(() => {
    if(!isConfigured) { setCheckingSession(false); return; }
    authService.getSession().then(s => { setSession(s); setCheckingSession(false); });
    const unsub = authService.onChange(s => setSession(s));
    return unsub;
  }, []);

  const refresh = useCallback(async ()=>{
    setLoadingRentals(true);
    try{ setRentals(await rentalService.list()); }
    catch(err){ push('Erro ao carregar locações: ' + err.message, 'error'); }
    finally{ setLoadingRentals(false); }
  }, [push]);

  useEffect(() => { if(session) refresh(); }, [session, refresh]);

  function handleLogin(s){ setSession(s); setScreen('dashboard'); }
  async function handleLogout(){ await authService.logout(); setSession(null); }

  function navigate(key){
    setEditingRentalId(null); setActiveRentalId(null); setActiveRental(null); setEditingRental(null);
    setScreen(key);
  }

  async function openRental(id, edit){
    try{
      const r = await rentalService.get(id);
      if(!r){ push('Locação não encontrada.', 'error'); return; }
      if(edit){ setEditingRentalId(id); setEditingRental(r); setScreen('form'); }
      else{ setActiveRentalId(id); setActiveRental(r); setScreen('details'); }
    }catch(err){ push('Erro ao abrir locação: ' + err.message, 'error'); }
  }

  async function handleSaved(id){
    await refresh();
    const r = await rentalService.get(id);
    setActiveRentalId(id); setActiveRental(r); setEditingRentalId(null); setEditingRental(null);
    setScreen('details');
  }

  function requestDelete(rental){ setDeleteTarget(rental); }
  async function confirmDelete(){
    setDeleting(true);
    try{
      await rentalService.remove(deleteTarget.id);
      await refresh();
      push('Locação excluída.', 'success');
      if(activeRentalId === deleteTarget.id || editingRentalId === deleteTarget.id){ setScreen('rentals'); setActiveRentalId(null); setEditingRentalId(null); }
    }catch(err){ push('Erro ao excluir: ' + err.message, 'error'); }
    finally{ setDeleting(false); setDeleteTarget(null); }
  }

  if(!isConfigured) return <ConfigNeeded />;
  if(checkingSession) return <div style={{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'var(--charcoal)'}}><Spinner label="Carregando…" /></div>;
  if(!session) return <LoginScreen onLogin={handleLogin} />;

  const titles = { dashboard:'Dashboard', rentals:'Locações', new:'Nova Locação', form: editingRentalId ? 'Editar Locação' : 'Nova Locação', details:'Detalhes da Locação', clients:'Clientes', settings:'Configurações' };

  let content = null;
  if(loadingRentals && (screen==='dashboard' || screen==='rentals')){
    content = <Spinner label="Carregando locações…" />;
  } else if(screen === 'dashboard'){
    content = <Dashboard rentals={rentals} onNavigate={navigate} onOpenRental={(id)=>openRental(id)} />;
  } else if(screen === 'rentals'){
    content = <RentalsList rentals={rentals} onOpenRental={openRental} onNavigate={navigate} onDeleteRequest={requestDelete} />;
  } else if(screen === 'new' || (screen === 'form' && !editingRentalId)){
    content = <RentalForm initial={null} onCancel={()=>navigate('rentals')} onSaved={handleSaved} pushToast={push} />;
  } else if(screen === 'form' && editingRentalId){
    content = editingRental ? <RentalForm initial={editingRental} onCancel={()=>{setScreen('details');}} onSaved={handleSaved} pushToast={push} /> : <Spinner label="Carregando locação…" />;
  } else if(screen === 'details' && activeRentalId){
    content = activeRental ? <RentalDetails rental={activeRental} onBack={()=>navigate('rentals')} onEdit={()=>{setEditingRentalId(activeRental.id); setEditingRental(activeRental); setScreen('form');}} onDeleteRequest={requestDelete} onStatusChanged={async ()=>{ const r = await rentalService.get(activeRental.id); setActiveRental(r); refresh(); }} pushToast={push} /> : <Spinner label="Carregando locação…" />;
  } else if(screen === 'clients'){
    content = <ClientsScreen rentals={rentals} onOpenRental={(id)=>openRental(id)} pushToast={push} />;
  } else if(screen === 'settings'){
    content = <SettingsScreen pushToast={push} />;
  }

  return (
    <div style={{display:'flex', minHeight:'100vh'}}>
      <Sidebar active={screen==='form'?'new':screen} onNavigate={navigate} session={session} onLogout={handleLogout} />
      <div style={{flex:1, minWidth:0, display:'flex', flexDirection:'column', paddingBottom: 70}}>
        <Topbar title={titles[screen] || ''} session={session} />
        <main style={{padding:'20px', flex:1}}>{content}</main>
      </div>
      <BottomNav active={screen==='form'?'new':screen} onNavigate={navigate} />
      <Toast toasts={toasts} onDismiss={dismiss} />
      <ConfirmModal open={!!deleteTarget} busy={deleting} title="Mover para a lixeira" danger={false}
        message={deleteTarget ? `Mover a locação de "${deleteTarget.customerName}" para a lixeira? Ela some das listas, mas fica recuperável em Configurações → Lixeira. As fotos não são apagadas.` : ''}
        confirmLabel="Mover para lixeira" onConfirm={confirmDelete} onCancel={()=>setDeleteTarget(null)} />
      <style>{`
        @media (min-width: 768px){
          .hidden.md\\:flex{ display:flex !important; } .hidden.md\\:block{ display:block !important; }
          .hidden.md\\:inline-flex{ display:inline-flex !important; } .md\\:hidden{ display:none !important; }
        }
        @media (max-width: 767px){ .hidden.md\\:flex, .hidden.md\\:block, .hidden.md\\:inline-flex{ display:none !important; } }
      `}</style>
    </div>
  );
}

/* Busca as credenciais em /api/config (função da Vercel) antes de montar
   qualquer coisa. Se falhar (rede fora do ar, variáveis não configuradas,
   ou rodando fora da Vercel), mostra a tela de configuração necessária. */
async function bootstrap(){
  try{
    const res = await fetch('/api/config');
    if(!res.ok) throw new Error('resposta não-ok de /api/config');
    const config = await res.json();
    if(!config.url || !config.anonKey) throw new Error('credenciais vazias');
    sb = window.supabase.createClient(config.url, config.anonKey);
    isConfigured = true;
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  }catch(err){
    ReactDOM.createRoot(document.getElementById('root')).render(<ConfigNeeded />);
  }
}
bootstrap();

</script>
</body>
</html>
